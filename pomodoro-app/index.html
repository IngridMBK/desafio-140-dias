<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro App</title>
  </head>
  <body>
    <header>
      <h1>Pomodoro App</h1>
      <p>Stay focused. Stay productive.</p>
      <nav>
        <ul>
          <li><a href="#timer">Timer</a></li>
          <li><a href="#settings">Settings</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="timer">
        <h2>Pomodoro Timer</h2>
        <p>25:00</p>
        <button type="button">Start</button>
      </section>
      <section>
        <h2>Today's progress</h2>
        <p>Completed Sessions: 0</p>
        <p>Focus Time: 0 minutes</p>
      </section>
      <section>
        <h2>Today's Goals</h2>
        <ul>
          <li>Study</li>
          <li>Work</li>
          <li>Reading</li>
        </ul>
      </section>
      <section id="settings">
        <h2>Settings</h2>
        <ul>
          <li>Pomodoro</li>
          <li>Short Break</li>
          <li>Long Break</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>Created by Ingrid Morbeck, 2026</p>
      <a
        href="https://github.com/IngridMBK"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
    </footer>
  </body>
</html>
